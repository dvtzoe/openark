name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  sizes:
    name: file size cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_file_sizes.sh

  plugin:
    name: plugin (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx biome check src tests
      - run: bunx vitest run
      - run: bun run build

  service:
    name: service (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,memory]"
      - run: ruff check .
      - run: basedpyright
      - run: pytest -q
