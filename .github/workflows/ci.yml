name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  sizes:
    name: file size cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_file_sizes.sh

  plugin:
    name: plugin (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npx biome check src tests
      - run: npx vitest run
      - run: npm run build

  service:
    name: service (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,memory]"
      - run: ruff check .
      - run: basedpyright
      - run: pytest -q
