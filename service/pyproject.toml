[project]
name = "openark-service"
version = "0.1.0"
description = "Local service backing openark agents: memory, persona, lessons, skills"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
memory = [
  "mem0ai>=2.0",
  "chromadb>=1.0",
  "fastembed>=0.4",
]
dev = [
  "basedpyright>=1.39",
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["openark"]
pythonVersion = "3.11"
# "standard" (pyright-compatible) rather than basedpyright's own stricter
# "all" default: this catches real type errors (wrong argument types,
# missing generic args) without also demanding full annotation coverage
# and zero `Any` across a codebase that mixes in untyped third-party libs
# (mem0, chromadb). Ratcheting up to a stricter mode is future work, not a
# blocker for having a type checker in the loop at all — see
# docs/plans/0003-findings-service-core.md #1.
typeCheckingMode = "standard"
reportMissingTypeStubs = false
